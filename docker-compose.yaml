# ─────────────────────────────────────────────────────────────────────────────
# Co-Founder — full local stack.
#
#   docker compose up --build
#
# Services:
#   kafka              Kafka broker (KRaft mode) — containers reach it at
#                      kafka:29092, host reaches it at localhost:9092.
#   redis              Cache used by the RAG engine & backend (REDIS_URL).
#   backend            FastAPI app (uvicorn) on :8000.
#   consumer-messages  Kafka consumer → add_message_to_session (per-topic,
#                      independently restarted).
#   consumer-memory    Kafka consumer → chat_memory.
#   consumer-titles    Kafka consumer → session_title_creation.
#   frontend           Next.js app on :3000.
#
# Secrets & API keys come from the root `.env` file (env_file) — never baked
# into images.
# ─────────────────────────────────────────────────────────────────────────────
services:
  kafka:
    image: confluentinc/cp-kafka:7.8.9
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "mQZfRkC1TQy0eFgH6JkL8A=="

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Keep the JVM lean for small VMs (2GB RAM): the Confluent default heap
      # is up to 1GB+, which alone can starve the rest of the stack. 512MB is
      # plenty for a single-node dev/prod broker.
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"

      # Internal listener (containers → kafka:29092) + host listener
      # (host → localhost:9092). Both are PLAINTEXT, just different ports so
      # the advertised address matches however the client connects.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 30"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      # Comma-separated browser origins allowed by CORS. Override for deploy,
      # e.g. CORS_ORIGINS=https://app.example.com in your shell/.env.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  consumer-messages:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer-messages
    command: ["python", "backend/kafka_jobs/consumers/add_message_to_session_job.py"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  consumer-memory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer-memory
    command: ["python", "backend/kafka_jobs/consumers/chat_memory_job.py"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  consumer-titles:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer-titles
    command: ["python", "backend/kafka_jobs/consumers/session_title_creation_job.py"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing API base URL — must be the PUBLIC backend URL for
        # production builds (e.g. https://api.example.com). The WebSocket is
        # derived from this same URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Google OAuth (Supabase) — public values inlined at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        # Optional. If set, use the FULL callback URL, e.g.
        # https://get-cofounder.tech/auth/callback (NOT the bare domain).
        # The app appends /auth/callback to a bare base as a safety net.
        NEXT_PUBLIC_AUTH_REDIRECT_URL: ${NEXT_PUBLIC_AUTH_REDIRECT_URL:-}
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kafka-data:
  redis-data: